name: Python package

# Tag prefix is py-v*, not v* - plain v* tags already trigger the binary
# release and Docker image workflows.
on:
  push:
    tags: ["py-v*"]
  pull_request:
    paths:
      - "python/**"
      - "crates/jugaad-rpc/**"
      - ".github/workflows/python-publish.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheels:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # Oldest supported Python, so the smoke test below is the strictest one.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Generate gRPC stubs
        working-directory: python
        run: |
          pip install -r requirements-gen.txt
          python generate.py

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          working-directory: python
          command: build
          args: --release --out dist
          manylinux: 2_28

      - name: Smoke test the built wheel in a clean venv
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/smoke"
          PY="$RUNNER_TEMP/smoke/bin/python"
          [ -x "$PY" ] || PY="$RUNNER_TEMP/smoke/Scripts/python"
          "$PY" -m pip install python/dist/*.whl
          "$PY" python/smoke_test.py

      - uses: actions/upload-artifact@v4
        with:
          name: dist-wheel-${{ matrix.os }}
          path: python/dist/*.whl

  # PyPI's packaging guide says to always upload an sdist alongside the wheels.
  # It is what pip builds from on a platform without a wheel (Intel Mac, Linux
  # ARM, musl), so it must work on its own: install from it and smoke test.
  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Generate gRPC stubs
        working-directory: python
        run: |
          pip install -r requirements-gen.txt
          python generate.py

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          working-directory: python
          command: sdist
          args: --out dist

      - name: Build from the sdist in a clean venv and smoke test it
        run: |
          python -m venv "$RUNNER_TEMP/from-sdist"
          "$RUNNER_TEMP/from-sdist/bin/python" -m pip install python/dist/*.tar.gz
          "$RUNNER_TEMP/from-sdist/bin/python" python/smoke_test.py

      - uses: actions/upload-artifact@v4
        with:
          name: dist-sdist
          path: python/dist/*.tar.gz

  # Tag pushes only; PR and workflow_dispatch runs build and smoke-test but
  # never upload. Needs a trusted publisher on test.pypi.org: project "sauda",
  # repo Am1n1602/jugaad-rs, workflow python-publish.yml, environment "testpypi".
  publish-testpypi:
    if: startsWith(github.ref, 'refs/tags/py-v')
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  # Real PyPI, only after the TestPyPI upload succeeded. Same trusted-publisher
  # fields on pypi.org with environment "pypi"; give that GitHub environment a
  # required reviewer so every release needs a manual approval.
  publish-pypi:
    if: startsWith(github.ref, 'refs/tags/py-v')
    needs: publish-testpypi
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
