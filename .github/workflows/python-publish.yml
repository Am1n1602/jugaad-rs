name: Python package

# Tag prefix is py-v*, not v* - plain v* tags already trigger the binary
# release and Docker image workflows.
on:
  push:
    tags: ["py-v*"]
  pull_request:
    paths:
      - "python/**"
      - "crates/jugaad-rpc/**"
      - ".github/workflows/python-publish.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheels:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # Oldest supported Python, so the smoke test below is the strictest one.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Generate gRPC stubs
        working-directory: python
        run: |
          pip install -r requirements-gen.txt
          python generate.py

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          working-directory: python
          command: build
          args: --release --out dist
          manylinux: 2_28

      - name: Smoke test the built wheel in a clean venv
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/smoke"
          PY="$RUNNER_TEMP/smoke/bin/python"
          [ -x "$PY" ] || PY="$RUNNER_TEMP/smoke/Scripts/python"
          "$PY" -m pip install python/dist/*.whl
          "$PY" python/smoke_test.py

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: python/dist/*.whl

  # Tag pushes only; workflow_dispatch builds and smoke-tests but never uploads.
  # Needs a trusted publisher on test.pypi.org: project "sauda", repo
  # Am1n1602/jugaad-rs, workflow python-publish.yml, environment "testpypi".
  publish:
    if: startsWith(github.ref, 'refs/tags/py-v')
    needs: wheels
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
